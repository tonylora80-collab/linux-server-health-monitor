name: Linux Monitor CI

on:
  push:
    branches: [ "main" ]

jobs:
  test-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Verify script permissions and run health check
        run: |
          chmod +x health_monitor.sh
          ./health_monitor.sh
